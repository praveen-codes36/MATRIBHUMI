<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
<clipPath id="c"><rect width="900" height="260" rx="18"/></clipPath>
<linearGradient id="saf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9933" stop-opacity="0"/><stop offset=".5" stop-color="#ff9933" stop-opacity=".9"/><stop offset="1" stop-color="#ff9933" stop-opacity="0"/></linearGradient>
<linearGradient id="grn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#138808" stop-opacity="0"/><stop offset=".5" stop-color="#138808" stop-opacity=".9"/><stop offset="1" stop-color="#138808" stop-opacity="0"/></linearGradient>
<linearGradient id="wht" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#c)">
<rect width="900" height="260" fill="url(#bg)"/>
<!-- flowing ribbons -->
<g>
<rect x="-900" y="40" width="1800" height="26" rx="13" fill="url(#saf)"><animate attributeName="x" values="-900;0;-900" dur="10s" repeatCount="indefinite"/></rect>
<rect x="0" y="70" width="1800" height="26" rx="13" fill="url(#wht)"><animate attributeName="x" values="0;-900;0" dur="12s" repeatCount="indefinite"/></rect>
<rect x="-900" y="100" width="1800" height="26" rx="13" fill="url(#grn)"><animate attributeName="x" values="-900;0;-900" dur="11s" repeatCount="indefinite"/></rect>
</g>
<!-- chakra -->
<g transform="translate(450,150)">
<circle r="46" fill="none" stroke="#3b82f6" stroke-width="3"><animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/></circle>
<g stroke="#3b82f6" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
<line y1="-46" y2="46"/><line x1="-46" x2="46"/><line x1="-32.5" y1="-32.5" x2="32.5" y2="32.5"/><line x1="-32.5" y1="32.5" x2="32.5" y2="-32.5"/>
<line x1="-17.6" y1="-42.5" x2="17.6" y2="42.5"/><line x1="-42.5" y1="-17.6" x2="42.5" y2="17.6"/><line x1="-42.5" y1="17.6" x2="42.5" y2="-17.6"/><line x1="-17.6" y1="42.5" x2="17.6" y2="-42.5"/></g>
<circle r="5" fill="#3b82f6"/></g>
<text x="450" y="232" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="4">BUILD FOR PEOPLE · BUILD WITH PURPOSE · BUILD FOR THE FUTURE</text>
</g></svg>
